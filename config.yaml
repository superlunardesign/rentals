# Rental Search Configuration
# Tumwater/Olympia, WA

location:
  center_zip: "98512"
  center_city: "Tumwater"
  center_state: "WA"
  # Coordinates for Tumwater (used for distance calculations)
  latitude: 46.9709
  longitude: -122.9093
  radius_miles: 15
  flexible_radius_miles: 20  # "Flexible" tier extends to this

budget:
  max_rent: 1800  # Update this to your max budget
  flexible_buffer: 150  # Flexible tier = max + buffer ($1950)

rooms:
  min_bedrooms: 2  # Minimum bedrooms required
  min_bathrooms: 1
  min_sqft: 800  # Minimum square footage

keywords:
  # Listings with these get boosted to "Best Match"
  preferred:
    - office
    - fence
    - fenced yard
    - garage
    - updated
    - renovated
    - washer
    - dryer
    - w/d
    - pet friendly
    - pets ok
    - dog

  # Listings with these are hidden completely
  dealbreakers:
    - shared room
    - roommate
    - no pets
    - senior living
    - 55+

# Scraper sources - add new property management sites here
sources:
  - name: "Olympic Landlord & Rental Services"
    scraper: "olyrents"
    url: "https://olyrents.com/properties/olympia/"
    enabled: true

  - name: "Team NW Property Management"
    scraper: "teamnwpm"
    url: "https://teamnwpm.com/available-homes/"
    enabled: true

  - name: "AMH Tumwater"
    scraper: "amh"
    url: "https://www.amh.com/query?criteria=Tumwater%2C+WA"
    enabled: true

# Scheduler settings
scheduler:
  interval_hours: 1
  run_on_startup: true

# Web dashboard settings
dashboard:
  host: "127.0.0.1"
  port: 8000
