# Rental Search Configuration
# Tumwater/Olympia, WA

location:
  center_zip: "98512"
  center_city: "Tumwater"
  center_state: "WA"
  # Coordinates for Tumwater (used for distance calculations)
  latitude: 46.9709
  longitude: -122.9093
  radius_miles: 15
  flexible_radius_miles: 20  # "Flexible" tier extends to this

budget:
  max_rent: 2600  # Your max budget
  flexible_buffer: 150  # Flexible tier = max + buffer ($2750)

rooms:
  min_bedrooms: 2  # Minimum bedrooms required
  min_bathrooms: 1
  min_sqft: 1200  # Minimum square footage

  # Best match criteria (must meet ALL for best match tier)
  best_match_bedrooms: 3
  best_match_sqft: 1500

keywords:
  # Listings with these get boosted to "Best Match"
  preferred:
    - office
    - fence
    - fenced yard
    - garage
    - bonus
    - bonus room
    - updated
    - renovated
    - washer
    - dryer
    - w/d
    - pet friendly
    - pets ok
    - dog

  # Listings with these are hidden completely
  dealbreakers:
    - shared room
    - roommate
    - no pets
    - senior living
    - 55+

# Scraper sources - add new property management sites here
sources:
  - name: "Olympic Landlord & Rental Services"
    scraper: "olyrents"
    url: "https://olyrents.propertyware.com/"
    enabled: true

  - name: "Team NW Property Management"
    scraper: "teamnwpm"
    url: "https://capitalproperties.appfolio.com/listings"
    enabled: true

  - name: "AMH Tumwater"
    scraper: "amh"
    url: "https://www.amh.com/query?criteria=Tumwater%2C+WA"
    enabled: true

  - name: "AMH Olympia"
    scraper: "amh"
    url: "https://www.amh.com/query?criteria=Olympia%2C+WA"
    enabled: true

  - name: "Hometown Property Management"
    scraper: "hometownpm"
    url: "https://hometownpropmgmt.appfolio.com/listings"
    enabled: true

  - name: "TJ Guyer Property Management"
    scraper: "tjguyer"
    url: "https://tjguyer.appfolio.com/listings"
    enabled: true

  - name: "Kenzie Property Management"
    scraper: "kenzie"
    url: "https://kenziepropertymanagement.appfolio.com/listings"
    enabled: true

  - name: "Greene Realty Group"
    scraper: "greene"
    url: "https://greenerealtygroup.appfolio.com/listings"
    enabled: true

  - name: "Windermere Olympia Property Management"
    scraper: "windermere"
    url: "https://windermereolympiapm.appfolio.com/listings"
    enabled: true

# Scheduler settings
scheduler:
  interval_hours: 1
  run_on_startup: true

# Web dashboard settings
dashboard:
  host: "127.0.0.1"
  port: 8000

# Telegram notifications for new matching listings
# To set up:
# 1. Message @BotFather on Telegram, send /newbot, follow prompts to create bot
# 2. Copy the bot token and set TELEGRAM_BOT_TOKEN env var (or put here)
# 3. Message your new bot, then visit: https://api.telegram.org/bot<TOKEN>/getUpdates
# 4. Find your chat_id in the response and set TELEGRAM_CHAT_ID env var (or put here)
notifications:
  telegram:
    enabled: true
    bot_token: ""  # Or set TELEGRAM_BOT_TOKEN env var
    chat_id: ""    # Or set TELEGRAM_CHAT_ID env var
    # Which tiers to notify about (BEST_MATCH, MATCH, FLEXIBLE)
    notify_tiers:
      - BEST_MATCH
      - MATCH
