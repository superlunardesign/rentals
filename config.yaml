# Rental Search Configuration
# Tumwater/Olympia, WA

location:
  center_zip: "98512"
  center_city: "Tumwater"
  center_state: "WA"
  # Coordinates for Tumwater (used for distance calculations)
  latitude: 46.9709
  longitude: -122.9093
  radius_miles: 15
  flexible_radius_miles: 20  # "Flexible" tier extends to this
  # Only show listings from these cities (case-insensitive)
  allowed_cities:
    - Tumwater
    - Olympia
    - Lacey
  # Zip codes eligible for BEST_MATCH/MATCH tiers
  # Listings in other local zips still show but as FLEXIBLE
  preferred_zips:
    - "98512"   # Tumwater
    - "98501"   # Olympia
    - "98506"   # Olympia

budget:
  max_rent: 2600  # Your max budget
  flexible_buffer: 150  # Flexible tier = max + buffer ($2750)

rooms:
  min_bedrooms: 2  # Minimum bedrooms required
  min_bathrooms: 1
  min_sqft: 1200  # Minimum square footage

  # Best match criteria (must meet ALL for best match tier)
  best_match_bedrooms: 3
  best_match_sqft: 1500

keywords:
  # Listings with these get boosted to "Best Match"
  preferred:
    - office
    - fence
    - fenced yard
    - garage
    - bonus
    - bonus room
    - updated
    - renovated
    - washer
    - dryer
    - w/d
    - pet friendly
    - pets ok
    - dog

  # Listings with these are hidden completely
  dealbreakers:
    - shared room
    - roommate
    - senior living
    - 55+
    - commercial
    - retail
    - office space
    - warehouse

